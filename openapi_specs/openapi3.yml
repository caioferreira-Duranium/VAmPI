openapi: 3.0.1
info:
  title: VAmPI
  description: OpenAPI v3 specs for VAmPI
  version: '0.1'
servers:
  - url: http://localhost:5000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      x-bearerInfoFunc: models.user_model.User.decode_auth_token
paths:
  /createdb:
    get:
      tags:
        - db-init
      summary: Creates and populates the database with dummy data
      description: Creates and populates the database with dummy data
      operationId: api_views.main.populate_db
      responses:
        '200':
          description: Creates and populates the database with dummy data
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Database populated.'
  /:
    get:
      tags:
        - home
      summary: VAmPI home
      description: >-
        VAmPI is a vulnerable on purpose API. It was created in order to
        evaluate the efficiency of third party tools in identifying
        vulnerabilities in APIs but it can also be used in learning/teaching
        purposes.
      operationId: api_views.main.basic
      responses:
        '200':
          description: Home - Help
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'VAmPI the Vulnerable API'
                  help:
                    type: string
                    example: 'VAmPI is a vulnerable on purpose API. It was created in order to evaluate the efficiency of third party tools in identifying vulnerabilities in APIs but it can also be used in learning/teaching purposes.'
                  vulnerable:
                    type: number
                    example: 1
  /users/v1:
    get:
      tags:
        - users
      summary: Retrieves all users
      description: Displays all users with basic information
      operationId: api_views.users.get_all_users
      responses:
        '200':
          description: See basic info about all users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        email:
                          type: string
                          example: 'mail1@mail.com'
                        username:
                          type: string
                          example: 'name1'
  /users/v1/_debug:
    get:
      tags:
        - users
      summary: Retrieves all details for all users
      description: Displays all details for all users
      operationId: api_views.users.debug
      responses:
        '200':
          description: See all details of the users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        admin:
                          type: boolean
                          example: false
                        email:
                          type: string
                          example: 'mail1@mail.com'
                        password:
                          type: string
                          example: 'pass1'
                        username:
                          type: string
                          example: 'name1'
  /users/v1/register:
    post:
      tags:
        - users
      summary: Register new user
      description: Register new user
      operationId: api_views.users.register_user
      requestBody:
        description: Username of the user
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: 'name1'
                password:
                  type: string
                  example: 'pass1'
                email:
                  type: string
                  example: 'user@tempmail.com'
        required: true
      responses:
        '200':
          description: Successfully created user
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Successfully registered. Login to receive an auth token.'
                  status:
                    type: string
                    enum: ['success', 'fail']
                    example: 'success'
        '400':
          description: Invalid request
          content: {}
  /users/v1/login:
    post:
      tags:
        - users
      summary: Login to VAmPI
      description: Login to VAmPI
      operationId: api_views.users.login_user
      requestBody:
        description: Username of the user
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: 'name1'
                password:
                  type: string
                  example: 'pass1'
        required: true
      responses:
        '200':
          description: Sucessfully logged in user
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    auth_token:
                      type: string
                      example: 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJleHAiOjE2NzAxNjA2MTcsImlhdCI6MTY3MDE2MDU1Nywic3ViIjoiSm9obi5Eb2UifQ.n17N4AxTbL4_z65-NR46meoytauPDjImUxrLiUMSTQw'
                    message:
                      type: string
                      example: 'Successfully logged in.'
                    status:
                      type: string
                      enum: ['success', 'fail']
                      example: 'success'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ['fail']
                    example: 'fail'
                  message:
                    type: string
                    example: 'Password is not correct for the given username.'
  /me:
    get:
        security:
          - bearerAuth: []
        tags:
          - users
        summary: Retrieves currently logged in user
        description: Displays information about the currently authenticated user
        operationId: api_views.users.me
        responses:
          '200':
            description: Display current user info
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        admin:
                          type: boolean
                          example: false
                        email:
                          type: string
                          example: 'mail1@mail.com'
                        username:
                          type: string
                          example: 'name1'
                    status:
                      type: string
                      example: 'success'
          '401':
            description: Unauthorized access due to expired, invalid, or missing token
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: string
                      example: 'fail'
                    message:
                      type: string
                      enum:
                        - 'Signature expired. Please log in again.'
                        - 'Invalid token. Please log in again.'

  /users/v1/{username}:
    get:
      tags:
        - users
      summary: Retrieves user by username
      description: Displays user by username
      operationId: api_views.users.get_by_username
      parameters:
        - name: username
          in: path
          description: retrieve username data
          required: true
          schema:
            type: string
            example: 'name1'
      responses:
        '200':
          description: Successfully display user info
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                    example: 'name1'
                  email:
                    type: string
                    example: 'mail1@mail.com'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ['fail']
                    example: 'fail'
                  message:
                    type: string
                    example: 'User not found'

    delete:
      security:
        - bearerAuth: [ ]
      tags:
        - users
      summary: Deletes user by username (Only Admins)
      description: Deletes user by username (Only Admins)
      operationId: api_views.users.delete_user
      parameters:
        - name: username
          in: path
          description: Delete username
          required: true
          schema:
            type: string
            example: 'name1'
      responses:
        '200':
          description: Successfully deleted user
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User deleted.'
                  status:
                    type: string
                    enum: ['success', 'fail']
                    example: 'success'
        '401':
          description: User not authorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'fail'
                    enum: ['fail']
                  message:
                    type: string
                    example: 'Only Admins may delete users!'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'fail'
                    enum: ['fail']
                  message:
                    type: string
                    example: 'User not found!'
  /users/v1/{username}/email:
    put:
      security:
        - bearerAuth: [ ]
      tags:
        - users
      summary: Update users email
      description: Update a single users email
      operationId: api_views.users.update_email
      parameters:
        - name: username
          in: path
          description: username to update email
          required: true
          schema:
            type: string
            example: 'name1'
      requestBody:
        description: field to update
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: 'mail3@mail.com'
        required: true
      responses:
        '204':
          description: Successfully updated user email
          content: {}
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ['fail']
                    example: 'fail'
                  message:
                    type: string
                    example: 'Please Provide a valid email address.'
        '401':
          description: User not authorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ['fail']
                    example: 'fail'
                  message:
                    type: string
                    example: 'Invalid token. Please log in again.'
  /users/v1/{username}/password:
    put:
      security:
        - bearerAuth: [ ]
      tags:
        - users
      summary: Update users password
      description: Update users password
      operationId: api_views.users.update_password
      parameters:
        - name: username
          in: path
          description: username to update password
          required: true
          schema:
            type: string
            example: 'name1'
      requestBody:
        description: field to update
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  example: 'pass4'
        required: true
      responses:
        '204':
          description: Successfully updated users password
          content: {}
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ['fail']
                    example: 'fail'
                  message:
                    type: string
                    example: 'Malformed Data'
        '401':
          description: User not authorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ['fail']
                    example: 'fail'
                  message:
                    type: string
                    example: 'Invalid token. Please log in again.'
  /books/v1:
    get:
      tags:
        - books
      summary: Retrieves all books
      description: Retrieves all books
      operationId: api_views.books.get_all_books
      responses:
        '200':
          description: See all books
          content:
            application/json:
              schema:
                type: object
                properties:
                  Books:
                    type: array
                    items:
                      type: object
                      properties:
                        book_title:
                          type: string
                        user:
                          type: string
              example:
                Books:
                  - book_title: 'bookTitle77'
                    user: 'name1'
                  - book_title: 'bookTitle85'
                    user: 'name2'
                  - book_title: 'bookTitle47'
                    user: 'admin'
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - books
      summary: Add new book
      description: Add new book
      operationId: api_views.books.add_new_book
      requestBody:
        description: >-
          Add new book with title and secret content only available to the user
          who added it.
        content:
          application/json:
            schema:
              type: object
              properties:
                book_title:
                  type: string
                  example: 'book99'
                secret:
                  type: string
                  example: 'pass1secret'
        required: true
      responses:
        '200':
          description: Successfully added a book
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Book has been added.'
                  status:
                    type: string
                    enum: ['success', 'fail']
                    example: 'success'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ['fail']
                    example: 'fail'
                  message:
                    type: string
                    example: 'Book Already exists!'
        '401':
          description: User not authorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ['fail']
                    example: 'fail'
                  message:
                    type: string
                    example: 'Invalid token. Please log in again.'
  /books/v1/{book_title}:
    get:
      security:
        - bearerAuth: [ ]
      tags:
        - books
      summary: Retrieves book by title along with secret
      description: >-
        Retrieves book by title along with secret. Only the owner may retrieve
        it
      operationId: api_views.books.get_by_title
      parameters:
        - name: book_title
          in: path
          description: retrieve book data
          required: true
          schema:
            type: string
            example: 'bookTitle77'
      responses:
        '200':
          description: Successfully retrieve book info
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    book_title:
                      type: string
                      example: 'bookTitle77'
                    owner:
                      type: string
                      example: 'name1'
                    secret:
                      type: string
                      example: 'secret for bookTitle77'
        '401':
          description: User not authorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ['fail']
                    example: 'fail'
                  message:
                    type: string
                    example: 'Invalid token. Please log in again.'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ['fail']
                    example: 'fail'
                  message:
                    type: string
                    example: 'Book not found!'
  /books/v1/{book_title}/cover:
    post:
      security:
        - bearerAuth: []
      tags:
        - books
      summary: Set a book cover from a remote URL
      description: >-
        Fetches the cover image from the given URL server-side and stores its
        metadata against the book.
      operationId: api_views.books.set_cover
      parameters:
        - name: book_title
          in: path
          description: book to set the cover for
          required: true
          schema:
            type: string
            example: 'bookTitle77'
      requestBody:
        description: Remote URL to fetch the cover image from
        content:
          application/json:
            schema:
              type: object
              properties:
                cover_url:
                  type: string
                  example: 'https://example.test/covers/bookTitle77.png'
        required: true
      responses:
        '200':
          description: Successfully fetched the cover
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'success'
                  content_type:
                    type: string
                    example: 'image/png'
                  size:
                    type: number
                    example: 10240
        '400':
          description: Invalid request
          content: {}
        '401':
          description: User not authorized
          content: {}
  /books/v1/{book_title}/export:
    get:
      security:
        - bearerAuth: []
      tags:
        - books
      summary: Export the book's stored report file
      description: Reads the named export file for the book from the exports directory.
      operationId: api_views.books.export_book
      parameters:
        - name: book_title
          in: path
          required: true
          schema:
            type: string
            example: 'bookTitle77'
        - name: file
          in: query
          description: export file name, defaults to {book_title}.txt
          required: false
          schema:
            type: string
            example: 'bookTitle77.txt'
      responses:
        '200':
          description: Successfully exported the book report
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'success'
                  content:
                    type: string
        '401':
          description: User not authorized
          content: {}
        '404':
          description: Export file not found
          content: {}
  /users/v1/{username}/preferences/import:
    post:
      security:
        - bearerAuth: []
      tags:
        - users
      summary: Import a serialized preferences blob
      description: >-
        Restores a user's preferences from a base64-encoded, serialized blob
        previously exported from the client.
      operationId: api_views.users.import_preferences
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            example: 'name1'
      requestBody:
        description: base64-encoded serialized preferences
        content:
          application/json:
            schema:
              type: object
              properties:
                preferences_blob:
                  type: string
        required: true
      responses:
        '200':
          description: Successfully imported preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'success'
                  username:
                    type: string
                    example: 'name1'
                  data:
                    type: object
        '400':
          description: Invalid preferences blob
          content: {}
        '401':
          description: User not authorized
          content: {}
  /reports/v1/diagnostics:
    post:
      security:
        - bearerAuth: []
      tags:
        - reports
      summary: Run a network diagnostics check
      description: Runs a ping against the given host for connectivity troubleshooting.
      operationId: api_views.reports.diagnostics
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  type: string
                  example: '127.0.0.1'
        required: true
      responses:
        '200':
          description: Diagnostics output
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'success'
                  output:
                    type: string
        '401':
          description: User not authorized
          content: {}
  /reports/v1/render-banner:
    post:
      security:
        - bearerAuth: []
      tags:
        - reports
      summary: Render a custom welcome banner
      description: Renders a client-supplied template string for a custom welcome banner.
      operationId: api_views.reports.render_banner
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: string
                  example: 'Welcome back!'
        required: true
      responses:
        '200':
          description: Rendered banner
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'success'
                  rendered:
                    type: string
        '401':
          description: User not authorized
          content: {}
  /reports/v1/partner-status:
    get:
      security:
        - bearerAuth: []
      tags:
        - reports
      summary: Credit-bureau partner integration status
      description: Returns the status of the mocked credit-bureau partner integration.
      operationId: api_views.reports.partner_status
      responses:
        '200':
          description: Partner status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'success'
                  partner:
                    type: string
                    example: 'credit-bureau-sandbox'
                  partner_api_key:
                    type: string
        '401':
          description: User not authorized
          content: {}
  /integrations/v1/catalog:
    post:
      security:
        - bearerAuth: []
      tags:
        - integrations
      summary: Import a partner book catalog (XML)
      description: Parses a client-supplied XML catalog document and returns its title.
      operationId: api_views.integrations.import_catalog
      requestBody:
        content:
          application/xml:
            schema:
              type: string
              example: '<catalog><title>Partner Catalog</title></catalog>'
        required: true
      responses:
        '200':
          description: Parsed catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'success'
                  title:
                    type: string
        '400':
          description: Malformed XML document
          content: {}
        '401':
          description: User not authorized
          content: {}
  /integrations/v1/config:
    post:
      security:
        - bearerAuth: []
      tags:
        - integrations
      summary: Load a YAML configuration snippet
      description: Parses a client-supplied YAML configuration document.
      operationId: api_views.integrations.load_config
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: string
                  example: 'timeout: 30'
        required: true
      responses:
        '200':
          description: Parsed config
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'success'
                  config:
                    type: string
        '401':
          description: User not authorized
          content: {}
  /integrations/v1/eval:
    post:
      security:
        - bearerAuth: []
      tags:
        - integrations
      summary: Evaluate a risk-scoring expression
      description: Evaluates a client-supplied arithmetic expression for ad-hoc risk scoring.
      operationId: api_views.integrations.run_expression
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expression:
                  type: string
                  example: '1 + 1'
        required: true
      responses:
        '200':
          description: Evaluation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'success'
                  result:
                    type: string
        '401':
          description: User not authorized
          content: {}
  /integrations/v1/imagemath:
    post:
      security:
        - bearerAuth: []
      tags:
        - integrations
      summary: Compute an image-processing expression
      description: Evaluates a client-supplied PIL ImageMath expression for document thumbnails.
      operationId: api_views.integrations.calculate_image_metric
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expression:
                  type: string
                  example: '1 + 1'
        required: true
      responses:
        '200':
          description: Computed result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'success'
                  result:
                    type: string
        '401':
          description: User not authorized
          content: {}
  /integrations/v1/redirect:
    get:
      security:
        - bearerAuth: []
      tags:
        - integrations
      summary: Redirect to a partner URL
      description: Redirects the client to the given partner URL after a successful handoff.
      operationId: api_views.integrations.redirect_to_partner
      parameters:
        - name: next
          in: query
          schema:
            type: string
          example: '/dashboard'
      responses:
        '302':
          description: Redirect
          content: {}
        '401':
          description: User not authorized
          content: {}
  /integrations/v1/restore:
    post:
      security:
        - bearerAuth: []
      tags:
        - integrations
      summary: Restore a backup archive
      description: Restores a base64-encoded zip archive of user preferences.
      operationId: api_views.integrations.restore_backup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                archive:
                  type: string
                  description: Base64-encoded zip archive
        required: true
      responses:
        '200':
          description: Restore result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'success'
                  message:
                    type: string
        '400':
          description: Invalid archive
          content: {}
        '401':
          description: User not authorized
          content: {}
